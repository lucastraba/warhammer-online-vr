name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (32-bit)
        run: cmake -S . -B build -A Win32
      - name: Build
        run: cmake --build build --config Release
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Collect install set
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/WARVR.dll, build/Release/WARVRInjector.exe, build/Release/openvr_api.dll dist/
          Copy-Item "extras/ai-generated WARVR.ini.example" dist/WARVR.ini.example
      - uses: actions/upload-artifact@v4
        with:
          name: WARVR-win32-${{ github.sha }}
          path: dist/

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cross build + unit tests
        run: tools/build-cross.sh build-cross
